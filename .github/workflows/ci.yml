name: CI

on:
  push:
    branches: [main]
    paths:
      - "Phising_website_detection/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Phising_website_detection/**"
      - ".github/workflows/ci.yml"

jobs:
  verify:
    name: Verify phishing-website-detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phising_website_detection

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check package imports
        run: uv run python -c "import phishing_detection; print(phishing_detection.__version__)"

      - name: Run the test suite
        run: uv run pytest

      - name: Run duplicate-aware evaluation
        run: uv run phishing-detector evaluate
