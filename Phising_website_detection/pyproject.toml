[project]
name = "phishing-website-detection"
version = "0.1.0"
description = "Detect phishing websites with a Random Forest classifier over 30 encoded URL and page features."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Krishnansu Mohapatra", email = "krishnansumohapatra20@gmail.com" },
]
keywords = [
    "machine-learning",
    "phishing",
    "random-forest",
    "scikit-learn",
    "security",
    "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.urls]
Repository = "https://github.com/KrishnansuMohapatra/ML_projects/tree/main/Phising_website_detection"
Issues = "https://github.com/KrishnansuMohapatra/ML_projects/issues"

[project.scripts]
phishing-detector = "phishing_detection.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishing_detection"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
